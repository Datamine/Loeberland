services:
  game:
    image: ${COMPOSE_PROJECT_NAME:-server}-runtime:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        PREBUILT_CLIENT: ${PREBUILT_CLIENT:-0}
        SF_BUILD_COMMIT: ${SF_BUILD_COMMIT:-}
    restart: unless-stopped
    init: true
    ports: ['127.0.0.1:8787:8787']
    environment:
      HOST: 0.0.0.0
      MAX_PLAYERS: ${MAX_PLAYERS:-2000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://johnloeber.com,https://www.johnloeber.com,https://datamine.github.io}
      DEPLOY_NOTICE_SOCKET: /tmp/loeberland-update.sock
      ADMIN_QUEUE_EDITS: ${ADMIN_QUEUE_EDITS:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CHECKPOINT_INTERVAL_MS: ${CHECKPOINT_INTERVAL_MS:-1000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      DEBUG_TELEPORT_ALL: '${DEBUG_TELEPORT_ALL:-${LOCAL_DEBUG_TELEPORT_ALL:-false}}'
      OAUTH_REQUIRED: '${OAUTH_REQUIRED:-True}'
      UPGRADE_REQUIRED_FOR_SERVER_CHAT: '${UPGRADE_REQUIRED_FOR_SERVER_CHAT:-True}'
      GOOGLE_CHAT_CLIENT_ID: ${GOOGLE_CHAT_CLIENT_ID:-}
      GOOGLE_CHAT_CLIENT_SECRET: ${GOOGLE_CHAT_CLIENT_SECRET:-}
      GOOGLE_CHAT_REDIRECT_URI: ${GOOGLE_CHAT_REDIRECT_URI:-}
    volumes:
      - world-data:/app/server/data
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
  admin:
    image: ${COMPOSE_PROJECT_NAME:-server}-runtime:${RELEASE_TAG:-local}
    pull_policy: never
    profiles: [admin, production]
    command: ['node', '--enable-source-maps', 'admin.mjs']
    restart: unless-stopped
    init: true
    env_file:
      - path: ${ADMIN_ENV_FILE:-.env}
        required: false
    environment:
      ADMIN_ENV_FILE: ''
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8788
      ADMIN_READ_ONLY: '1'
      ADMIN_QUEUE_EDITS: ${ADMIN_QUEUE_EDITS:-1}
      ADMIN_PUBLIC_HOST: ${GAME_DOMAIN:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports: ['127.0.0.1:8788:8788']
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8788/').then(r => process.exit(r.status === 401 ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 1s
      retries: 15
  proxy:
    image: caddy:2.11-alpine
    profiles: [production]
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:-localhost}
    volumes:
      - ./${CADDY_CONFIG:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [game]
volumes:
  world-data:
  redis-data:
  caddy-data:
  caddy-config:
