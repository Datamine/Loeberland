<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Loeberland database editor</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f6f8;
        color: #19202c;
        font:
          15px system-ui,
          sans-serif;
      }
      header {
        padding: 20px 24px;
        background: #fff;
        border-bottom: 1px solid #dce0e6;
      }
      h1 {
        font-size: 21px;
        margin: 0 0 6px;
      }
      p {
        margin: 6px 0;
        color: #536071;
      }
      .notice {
        padding: 12px 24px;
        background: #fff3d7;
        color: #634509;
      }
      .layout {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        height: calc(100dvh - 150px);
        min-height: 420px;
      }
      aside {
        padding: 16px;
        border-right: 1px solid #dce0e6;
        overflow: auto;
      }
      main {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      input,
      button,
      select,
      textarea {
        font: inherit;
      }
      input {
        padding: 10px;
        width: 100%;
        border: 1px solid #b9c2cf;
        border-radius: 6px;
      }
      button {
        cursor: pointer;
        padding: 9px 14px;
        border: 1px solid #b9c2cf;
        background: #fff;
        border-radius: 6px;
        color: inherit;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.primary {
        background: #235bd6;
        color: #fff;
        border-color: #235bd6;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      #records {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 12px;
      }
      #records button {
        text-align: left;
        overflow-wrap: anywhere;
      }
      #records button.active {
        border-color: #235bd6;
        background: #e8efff;
      }
      small {
        display: block;
        color: #647085;
        font-size: 11px;
        margin-top: 3px;
      }
      h2 {
        margin: 0;
        font-size: 17px;
        overflow-wrap: anywhere;
      }
      #key {
        overflow-wrap: anywhere;
        font-size: 12px;
      }
      .record-fields {
        display: flex;
        align-items: flex-start;
        flex: 1;
        min-height: 0;
        gap: 16px;
      }
      #equipment {
        flex: 0 1 230px;
        padding: 14px;
        border: 1px solid #dce0e6;
        border-radius: 6px;
        background: #fff;
        max-height: 100%;
        overflow: auto;
      }
      #equipment-hint {
        color: #647085;
        font-size: 13px;
      }
      #equipment-fields label {
        display: block;
        margin-top: 10px;
        font-size: 13px;
      }
      #equipment-fields select {
        display: block;
        width: 100%;
        margin-top: 3px;
        padding: 6px;
        border: 1px solid #b9c2cf;
        border-radius: 6px;
        background: #fff;
        color: inherit;
      }
      textarea {
        flex: 1;
        align-self: stretch;
        min-width: 0;
        min-height: 260px;
        resize: vertical;
        padding: 16px;
        border: 1px solid #b9c2cf;
        border-radius: 6px;
        background: #fff;
        tab-size: 2;
        font:
          14px/1.6 ui-monospace,
          SFMono-Regular,
          monospace;
        white-space: pre;
      }
      #status {
        min-height: 22px;
        overflow-wrap: anywhere;
      }
      #status.error {
        color: #b42318;
      }
      #status.success {
        color: #167043;
      }
      #source {
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      #count {
        margin: 12px 0;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #7aa2ff;
        outline-offset: 2px;
      }
      @media (max-width: 700px) {
        .layout {
          grid-template-columns: 1fr;
          height: auto;
        }
        aside {
          border-right: 0;
          border-bottom: 1px solid #dce0e6;
          max-height: 280px;
        }
        main {
          min-height: 65dvh;
        }
        header,
        .notice {
          padding: 14px 16px;
        }
      }
      @media (max-width: 900px) {
        .record-fields {
          flex-direction: column-reverse;
        }
        #equipment {
          flex: 0 0 auto;
          align-self: stretch;
        }
        #equipment-fields:not([hidden]) {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 0 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Loeberland database editor</h1>
      <p id="source">Connecting…</p>
    </header>
    <div class="notice">__ADMIN_NOTICE__</div>
    <div class="layout">
      <aside>
        <label for="search">Find a record</label>
        <input id="search" type="search" placeholder="Username, player ID, or world…" />
        <p id="count"></p>
        <button id="refresh" type="button">Refresh list</button>
        <nav id="records" aria-label="Database records"></nav>
      </aside>
      <main>
        <h2 id="title">Choose a record</h2>
        <p id="key">Select a player, the world snapshot, or a username from the list.</p>
        <div class="toolbar">
          <button id="save" class="primary" disabled>Save changes</button>
          <button id="format" disabled>Format JSON</button>
          <button id="reload" disabled>Reload record</button>
          <span id="dirty"></span>
        </div>
        <label for="editor">Record value (JSON)</label>
        <div class="record-fields">
          <textarea
            id="editor"
            spellcheck="false"
            disabled
            placeholder="The selected record will appear here."
          ></textarea>
          <section id="equipment" aria-labelledby="equipment-title" hidden>
            <h2 id="equipment-title">Equipment</h2>
            <p id="equipment-hint"></p>
            <div id="equipment-fields"></div>
          </section>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
      </main>
    </div>
